name: CI

# Staged pipeline: each stage gates the next.
#
#   quality ──▶ test ─────┐
#           ├─▶ fixture ──┤
#           └─▶ coverage ─┴▶ validate ──▶ release (tags only)
#
# quality also runs knip (dead-code) and the manifest version check. A push or
# PR runs quality → test/fixture/coverage → validate. Pushing a vX.Y.Z tag
# additionally runs release, which publishes the GitHub release from CHANGELOG.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  # Manual fallback. GitHub has silently failed to deliver tag-push events for
  # this repo (v0.41.0 fired no run at all, on the original push or on two
  # re-pushes of the same tag, while branch pushes kept working). Releases must
  # not depend on a delivery path we do not control, so the same pipeline can be
  # started by hand against an existing tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, e.g. v0.42.0. Leave blank to run CI only."
        required: false
        default: ""

# Least privilege by default; only the release job elevates to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 — fast static gate. A single Node; everything downstream needs it.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint & format (biome)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Dead code (knip — unused files, exports, deps)
        run: npm run knip
      - name: Manifest version consistency
        run: node scripts/check-versions.mjs

  # Stage 2a — unit + integration suite on every supported Node.
  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (engines: >=22) and current.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test

  # Stage 2c — coverage gate. Fails if coverage regresses below the ratchet
  # floor in vitest.config.ts (runs alongside test/fixture).
  coverage:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # Stage 2b — the golden-suite fixture sub-package (runs alongside test).
  fixture:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmarks/fixture/package-lock.json
      - run: npm ci
        working-directory: benchmarks/fixture
      - run: npm test
        working-directory: benchmarks/fixture
      - run: npm run typecheck
        working-directory: benchmarks/fixture

  # Stage 3 — package integrity: plugin manifest + a CLI smoke run.
  validate:
    needs: [test, fixture, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .
      - name: CLI smoke — status renders against an empty DB
        run: TOKEN_WARDEN_DB="$RUNNER_TEMP/smoke.db" npx tsx src/status.ts > /dev/null

  # Stage 4 — deploy. On a vX.Y.Z tag only: publish the GitHub release with
  # notes taken straight from CHANGELOG.md. Idempotent (updates if it exists).
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One name for the tag regardless of how the job was reached, so every step
    # below is identical on both paths.
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch runs from a branch, so check out the tag being released;
          # otherwise the manifest check would compare the tag against whatever
          # main currently holds.
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Derive version and verify it matches the manifests
        id: ver
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match package.json version $PKG"
            exit 1
          fi
          node scripts/check-versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The version is passed through env rather than interpolated directly into
      # the run block: `${{ }}` inside `run:` is substituted before the shell
      # sees it, so a value carrying shell metacharacters would execute. Reaching
      # this job already requires push access (the value derives from the tag and
      # is checked against package.json above), but the repo has had an attacker
      # with write access before, and the env form costs nothing.
      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/changelog-section.mjs "$VERSION" > RELEASE_NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          fi
